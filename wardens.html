<script id="m" type="application/json">{"v":1,"title":"The Covenant of the Flowers","bookId":"the-covenant-of-the-flowers-chf0k8l1","collectionName":"The Wardens of Dawn and Dusk","publish":{"landingLine":"May the Eight-Point Endure","password":"Eternal","openingEffect":"fade","supabaseUrl":"https://qnnkguvmzdvnsbnxxpbz.supabase.co","supabaseKey":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFubmtndXZtemR2bnNibnh4cGJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMDE4OTksImV4cCI6MjA5Nzg3Nzg5OX0.txBQjtXReYpFRU0p0YaBeyy3_3CjuLAPHJsmlwNHjyE","transition":"fadeblack","fileName":"wardens","flipOpening":"keystroke","flipWipeSpeed":0.6,"syncDelay":true},"typography":{"font":"spectral","size":1.1,"measure":40,"align":"left","columns":1},"settings":{"scheme":"light","warmth":1,"brightness":1,"cueDefaults":{"startTime":0,"loop":true}},"chapters":[{"id":"chf0k8l1","title":"The Wardens of Dawn and Dusk","paras":[{"id":"pmqxr0z1m1dkb","text":"THE\nWARDENS OF DAWN AND DUSK","html":"<span style=\"font-size:0.85em\"><span style=\"font-size:1.6em\">THE\nWARDENS OF DAWN AND DUSK<\/span><\/span>","align":"center"},{"id":"pmqxr0z1m2lfm","text":"A Comparative Account","align":"center"},{"id":"pmqxr0z1m36xg","text":"From the Proceedings of the\nArchival Committee, Citadel Repository of Letters, CP 1019. Prepared by the Office of\nTextual Curation, with the Department of Ancient and Common Imperial Languages, occasioned by three\nrecoveries of the present cycle.","html":"<i>From the Proceedings of the\nArchival Committee, Citadel Repository of Letters, CP 1019. Prepared by the Office of\nTextual Curation, with the Department of Ancient and Common Imperial Languages, occasioned by three\nrecoveries of the present cycle.<\/i>","align":"justify"},{"id":"pmqxr0z1m6zg4","text":"It is the pleasure of the\nCommittee, whenever possible, to enlarge the public understanding of the\ninstitutions that shaped our first era. Presently we concern ourselves with the\nDawnwarden Corps and the Duskwarden Order, both of which still exist today in\nreformed capacity. But one must wonder the extent of their metamorphosis in the\ncourse of a thousand years. Several documents have recently come into the\nRepository’s keeping, and together they shine new light.","align":"justify"},{"id":"pmqxr0z1m7gay","text":"We begin with the order better\nknown to us, and dearer.","align":"justify"},{"id":"pmqxr0z1m8de2","text":"THE\nDAWNWARDEN CORPS","align":"center"},{"id":"pmqxr0z1m9g34","text":"The golden\ncompany is often imagined to be a ceremonial body, but this was not always the case: they were\nthe foremost martial order of the empire, drawn from its most able. The state\nprocessions we enjoy today are only a glimpse of their original function.","align":"justify"},{"id":"pmqxr0z1ma2of","text":"While the Dämmerung Era was\nprimordial in its formation, those newly gathered under the Dawn required more\nthan safety. It required a pride in that assurance, drawing upon the best\ntoward its service rather than against it, and forging bond between the throne\nand those it governed. The Dawnwarden Corps was this noble emissary, given\nface.","align":"justify"},{"id":"pmqxr0z1mb343","text":"Chief among the dawnwarden\ncharges was the Eternal Flame of the Prytaneion (always kept by a standing\ndetail of twelve). To stand the flame-watch was the highest honor, the ceasing\nof this flame utterly unthinkable.","align":"justify"},{"id":"pmqxr0z1mc6cp","text":"If there is any doubt in the\nprowess of the Corps, one need only revisit the Samarkand Accord in CP 544,\nwhen Khan Toghan rose among the northern steppes to unite the clans of his\nhomeland. In response, the Crown dispatched Captain Hannibal Demaria to the\nkhan’s court as an imperial envoy. Records suggest a friendship developed\nbetween the two men, and during this time the khan’s confederation did not\nfurther encroach against imperial territory.","align":"justify"},{"id":"pmqxr0z1mdx7l","text":"The Accord ended where it\nbegan. Khan Toghan ordered Samarkand burned in response to an unknown\nprovocation. Captain Demaria was unable to dissuade him in private counsel, and\ndrew his blade to protect thousands of lives. It was here he smote the great khan,\nthough he would also die in the process.","align":"justify"},{"id":"pmqxr0z1me333","text":"His sacrifice felled the rising\nthreat that single afternoon. Having lost its unifying figure, the tribes of\nAshokan returned to isolation and self-governance under the loose overlordship\nof the khan’s half-brother. The people of Samarkand maintained independence as\na protectorate of the empire until they were officially reabsorbed in CP 902.","align":"justify"},{"id":"pmqxr0z1mfwzm","text":"This brave dawnwarden lies in\nan honored sepulcher in the necropolis of Gur-e-Amir, watched over by the\nfigure of a small peregrine.","align":"justify"},{"id":"pmqz5a0011iuv","text":"✻","align":"center"},{"id":"pmqxr0z1mhjm2","text":"A Letter from Captain\nHannibal Demaria to the Khan Toghan. Dated 23rd of the Star, CP\n544, bequeathed to the Crown from the Ashokan Khanate as a gesture of peace and\ngoodwill.","html":"<i>A Letter from Captain\nHannibal Demaria to the Khan Toghan. Dated 23rd of the Star, CP\n544, bequeathed to the Crown from the Ashokan Khanate as a gesture of peace and\ngoodwill.<\/i>"},{"id":"pmqxr0z1mjqd6","text":"Lord Toghan,","html":"<i>Lord Toghan,<\/i>"},{"id":"pmqxr0z1mkq6z","text":"Helena sends her warmth from our father’s\nhouse, wishing you a prosperous new cycle. I must prepare you, for over the\nwinter she set about a composition of steppe philosophies, and now seeks your\nindulgence. Rather fervently, I might add.","html":"<i>Helena sends her warmth from our father’s\nhouse, wishing you a prosperous new cycle. I must prepare you, for over the\nwinter she set about a composition of steppe philosophies, and now seeks your\nindulgence. Rather fervently, I might add.<\/i>"},{"id":"pmqxr0z1ml1js","text":"While I’ve done my best to govern her\nenthusiasm, I’ve nonetheless been tasked with a presentation of the manuscript\nwhen next we clasp arms.","html":"<i>While I’ve done my best to govern her\nenthusiasm, I’ve nonetheless been tasked with a presentation of the manuscript\nwhen next we clasp arms.<\/i>"},{"id":"pmqxr0z1mmz1p","text":"Hear me, Toghan.","html":"<i>Hear me, Toghan.<\/i>"},{"id":"pmqxr0z1mn84f","text":"There are forces moving against the peace.\nA merchant of Kashgar told me, in his cup, that he’d been strongarmed into\nsmuggling quicksilver artifacts via the silk road. If a provocation arrives, do\nnot let your eyes deceive you. Seek counsel from your half-brother, for he is\ntruly the Eostrix of your people.","html":"<i>There are forces moving against the peace.\nA merchant of Kashgar told me, in his cup, that he’d been strongarmed into\nsmuggling quicksilver artifacts via the silk road. If a provocation arrives, do\nnot let your eyes deceive you. Seek counsel from your half-brother, for he is\ntruly the Eostrix of your people.<\/i>"},{"id":"pmqxr0z1moqh3","text":"Until I’ve returned, will you care for\nKhulan? She still mourns the loss of her hatchling.","html":"<i>Until I’ve returned, will you care for\nKhulan? She still mourns the loss of her hatchling.<\/i>"},{"id":"pmqxr0z1mpu3i","text":"Yours,","html":"<i>Yours,<\/i>"},{"id":"pmqxr0z1mqkyu","text":"Hannibal Demaria","html":"<i>Hannibal Demaria<\/i>"},{"id":"pmqxr0z1mrji5","text":" "},{"id":"pmqxr0z1msup3","text":"It is the general consensus\nthat Khulan was a peregrine gifted to Hannibal in the course of their\nfellowship. The memoirs of the khan’s half-brother support this, describing a\nfalconry tradition of speaking with peregrines through the ritual consumption\nof ayahuasca, a psychedelic capable of inducing heightened emotional awareness.\nHe records that his brother the khan “taught the practice to the messenger\nbefore their fracture.”","align":"justify"},{"id":"pmqxr0z1mteck","text":"✻","align":"center"},{"id":"pmqxr0z1mulwf","text":"THE\nDUSKWARDEN ORDER","align":"center"},{"id":"pmqxr0z1mve64","text":"While equally known, much of\ntheir purpose has been shrouded in mystery. Their official role held them to be\na counterintelligence service charged with the management of sedition. This is\nthe account preserved in civic history, but the recovery of the earliest known\nDuskwarden Charter causes us to rethink the particulars.","align":"justify"},{"id":"pmqxr0z1mwr43","text":"It is a single tablet found\nwithin the depths of Citadel’s catacombs, strictly translated here into\nImperial Common. We caution the reader that it does not suggest the function of\na counterintelligence bureau.","align":"justify"},{"id":"pmqxr0z1mxeor","text":"THE CHARTER","align":"center"},{"id":"pmqxr0z1myzdi","text":"I. The Dawn must rise upon a quiet world. So the citizen may wake\nto harmony and never learn its price, our family keeps the night. We do not\nbegrudge the morning its peace, nor fault our brothers for their ease. The\nduskwarden who pursues his own vanity condemns himself to the gloam.","html":"<b>I.<\/b> The Dawn must rise upon a quiet world. So the citizen may wake\nto harmony and never learn its price, our family keeps the night. We do not\nbegrudge the morning its peace, nor fault our brothers for their ease. The\nduskwarden who pursues his own vanity condemns himself to the gloam.","align":"justify"},{"id":"pmqxr0z1mz3v0","text":"II. Truth guides the hand. Wherever hearts are given to rebellion,\naccounts may be settled. To settle a debt you cannot enumerate is theft, for\nyou have taken what the Dawn has not called due. Without exception, the warden\nerrs toward morning.","html":"<b>II.<\/b> Truth guides the hand. Wherever hearts are given to rebellion,\naccounts may be settled. To settle a debt you cannot enumerate is theft, for\nyou have taken what the Dawn has not called due. Without exception, the warden\nerrs toward morning.","align":"justify"},{"id":"pmqxr0z1m102zw","text":"III. The warden rules his undertow. The cruel are carried toward\nthe deed, the gentle away from it, and neither has willed a thing. Let the\nwarden stand in his current, and let him not move a step he did not choose.","html":"<b>III.<\/b> The warden rules his undertow. The cruel are carried toward\nthe deed, the gentle away from it, and neither has willed a thing. Let the\nwarden stand in his current, and let him not move a step he did not choose.","align":"justify"},{"id":"pmqxr0z1m116il","text":"IV. A knight of the dusk sharpens himself for the gloam that would\nfind him unprepared. Will without strength is death, and the morning shall be\nbrighter for your absence.","html":"<b>IV.<\/b> A knight of the dusk sharpens himself for the gloam that would\nfind him unprepared. Will without strength is death, and the morning shall be\nbrighter for your absence.","align":"justify"},{"id":"pmqxr0z1m12q1o","text":"V. The watch is not set down. The warden who dies in service to\nthe Dawn is welcomed into Dusk itself. He who breaks his oath embraces the\ngloam he was sworn to end. Him the family does not mourn, but settles, and\nhunts home.","html":"<b>V.<\/b> The watch is not set down. The warden who dies in service to\nthe Dawn is welcomed into Dusk itself. He who breaks his oath embraces the\ngloam he was sworn to end. Him the family does not mourn, but settles, and\nhunts home.","align":"justify"},{"id":"pmqxr0z1m13zez","text":" "},{"id":"pmqxr0z1m144mo","text":"The reader will have noted the\nsame as our team, in what the language implies.","align":"justify"},{"id":"pmqxr0z1m15x8x","text":"On the First Tenet. The\nOrder understood itself and the dawnwardens as two branches of one tree. “We do\nnot begrudge the morning its forgetting” is thus a vow, and to go unthanked was\nthe accepted price of the work. Note that dusk was a righteous dark the warden\nkept on the morning’s behalf; gloam was its corruption. The duskwarden served\nthe one and destroyed the other.","align":"justify"},{"id":"pmqxr0z1m165e9","text":"On the Second Tenet. This\nTenet defines restraints. Where transgression was clear, the warden imposed\nswift justice. Where uncertainty remained, he was bound to morning, morning\nbeing mercy.","align":"justify"},{"id":"pmqxr0z1m1735a","text":"On the Third Tenet. The\nundertow represents the pull of one’s own temperament, which the Order\ncautioned against. In short, the warden who killed from appetite and the warden\nwho spared from squeamishness had committed the same sin.","align":"justify"},{"id":"pmqxr0z1m18wdf","text":"On the Fourth Tenet. A\nfitness mandate for any sudden demand. The closing line reads as disdain for\nweakness. Quite simply, it was better the watch stood empty than stood as an\nopen gate.","align":"justify"},{"id":"pmqxr0z1m190wr","text":"On the Fifth Tenet. The\nwarden who dies honorably joins the sacred dark, while the oathbreaker is given\nthe gloam in forfeiture of that communion. Sanctified in the watch, or\ndestroyed for leaving it.","align":"justify"},{"id":"pmqxr0z1m1a5yd","text":"","align":"center"},{"id":"pmqxr0z1m1baa2","text":"THE PRELATE'S LETTER","align":"center"},{"id":"pmqxr0z1m1cspv","text":"The second recovery is a letter\nbearing the seal of the Duskwarden Prelate. It is addressed to a lovestruck\noperative named Kahlil, who had evidently petitioned for a blessing of\nmarriage. The woman Kahlil wished to marry was a dawnwarden named Asia.","align":"justify"},{"id":"pmqxr0z1m1dsrq","text":"We present the letter in\nImperial Common in as literal a translation as the lexicon allows.","align":"justify"},{"id":"pmqxr0z1m1e06q","text":"Kahlil,","html":"<i>Kahlil,<\/i>"},{"id":"pmqxr0z1m1fh4n","text":"I am glad you came to me. That you’ve\nwritten so beautifully of this dawnwarden speaks a great deal of your heart and\nthe turmoil within it. Know that my own hand carries the same love for you, the\nsame wish for your life to be lived to its fullest extent.","html":"<i>I am glad you came to me. That you’ve\nwritten so beautifully of this dawnwarden speaks a great deal of your heart and\nthe turmoil within it. Know that my own hand carries the same love for you, the\nsame wish for your life to be lived to its fullest extent.<\/i>"},{"id":"pmqxr0z1m1gz4z","text":"You believe you are asking my leave to be\nwith Asia, but it is of her that I would urge you carefully reflect. You would\nbe a husband she never truly knows, because your oath requires silence. But in\ntime, she will learn of this locked door. And in time, you will pass her the\nkey.","html":"<i>You believe you are asking my leave to be\nwith Asia, but it is of her that I would urge you carefully reflect. You would\nbe a husband she never truly knows, because your oath requires silence. But in\ntime, she will learn of this locked door. And in time, you will pass her the\nkey.<\/i>"},{"id":"pmqxr0z1m1hp8s","text":"You will love her above all things, and one\nnight you will break her heart with the truth. And then, Kahlil, you will have\ndone to her what I am writing this letter to prevent. This light of hers you\nlove, the light that drew you up out of the dusk, will be dimmed. You will look\nat her across your table or within your marital bed and understand too late\nthat in marrying the light you have only consumed it.","html":"<i>You will love her above all things, and one\nnight you will break her heart with the truth. And then, Kahlil, you will have\ndone to her what I am writing this letter to prevent. This light of hers you\nlove, the light that drew you up out of the dusk, will be dimmed. You will look\nat her across your table or within your marital bed and understand too late\nthat in marrying the light you have only consumed it.<\/i>"},{"id":"pmqxr0z1m1i8sc","text":"I encourage marriage within our family\nbecause neither must keep a locked door. There is nothing in one that must be\nhidden from the other, for they hold the same dusk between them. There is no\ngrief in them but the grief that is already unique to us. I bless such unions\ngladly.","html":"<i>I encourage marriage within our family\nbecause neither must keep a locked door. There is nothing in one that must be\nhidden from the other, for they hold the same dusk between them. There is no\ngrief in them but the grief that is already unique to us. I bless such unions\ngladly.<\/i>"},{"id":"pmqxr0z1m1jata","text":"[here the leaf is damaged]","html":"<i>[here the leaf is damaged]<\/i>"},{"id":"pmqyyv1i41942","type":"image","imgId":"mqyyud92izjty","float":"center","blend":true,"width":21,"behind":true,"left":80.3,"top":4713,"opacity":0.2,"tone":"sepia","anchorPid":"pmqxr0z1m1e06q","anchorDy":44},{"id":"pmqxr0z1m1k2h8","text":"Those who come to know what we are, and are\nnot bound by our oaths, seldom patron the morning. Kahlil, I write this because\nI would not have you learn such truth the hard way. If you walk this path, I\ncannot protect her.","html":"<i>Those who come to know what we are, and are\nnot bound by our oaths, seldom patron the morning. Kahlil, I write this because\nI would not have you learn such truth the hard way. If you walk this path, I\ncannot protect her.<\/i>"},{"id":"pmqxr0z1m1l6kv","text":"So I withhold my blessing, and I do it as\nyour father would: against my own desire to see you happy. I know the ache you\ncarry, for I’ve walked this path before you. Find your completion within the\nfamily, Kahlil, where I may be prodigal with my endowment and where no one need\npay for your happiness but you.","html":"<i>So I withhold my blessing, and I do it as\nyour father would: against my own desire to see you happy. I know the ache you\ncarry, for I’ve walked this path before you. Find your completion within the\nfamily, Kahlil, where I may be prodigal with my endowment and where no one need\npay for your happiness but you.<\/i>"},{"id":"pmqxr0z1m1mfpl","text":"You know what you must do with this letter.","html":"<i>You know what you must do with this letter.<\/i>"},{"id":"pmqxr0z1m1nuca","text":"[The seal of the moth and\nscroll is impressed beneath.]","html":"<i>[The seal of the moth and\nscroll is impressed beneath.]<\/i>"},{"id":"pmqxr0z1m1opx1","text":"","align":"center"},{"id":"pmqz7kfpd0zns","text":"✻","align":"center"},{"id":"pmqxr0z1m1puh5","text":"IN\nCLOSING","align":"center"},{"id":"pmqxr0z1m1qqnz","text":"Interestingly, the records\nreveal a dawnwarden by the name of Kahlil’s beloved, noted for standing the\nflame-watch. There is nothing to say what became of her, or if the two were\never wed.","align":"justify"},{"id":"pmqxr0z1m1rvsy","text":"Moreover, the Committee cannot\nestablish that the Asia of the service record and the Asia of the Prelate’s\nletter are the same woman. We can only conclude the irony that a warden of the\ndusk, named for the poet of radiant love, should have set his heart on a woman\nnamed after the land where dawn begins.","align":"justify"},{"id":"pmqxr0z1m1snij","text":"We had set out to compare two\norganizations of the empire’s elite men and women, the one that kept the\nmorning and the one that kept the night. We now find that the comparison is not\nas tidy as once thought, and that the peace was kept by hands we are only now\nbeginning to see. Sometimes at great price.","align":"justify"},{"id":"pmqxr0z1m1t18s","text":" "},{"id":"pmqxr0y9d0ve0","text":"\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n"},{"id":"pmqxr0z1m1u7dq","text":"\n\nArchival\nCommittee, Citadel Repository of Letters, CP 1019\n\n","html":"<i>\n\nArchival\nCommittee, Citadel Repository of Letters, CP 1019\n\n<\/i>"}],"textboxes":[],"autoplay":null,"elements":[],"atmos":{"type":"rain","intensity":55,"inPid":null,"outPid":null,"speed":1,"place":"center"},"shapes":[],"pages":[]}],"beds":[{"id":"mqz55 (function(){
  if(!('ontouchstart' in window) && !(navigator.maxTouchPoints>0)) return;
  if(window.GestureEvent){
    var gBase=1;
    document.addEventListener('gesturestart',function(e){ e.preventDefault(); gBase=rbFScale; },{passive:false});
    document.addEventListener('gesturechange',function(e){ e.preventDefault(); rbFScale=rbClampF(gBase*e.scale); applyFScale(false); },{passive:false});
    document.addEventListener('gestureend',function(e){ try{e.preventDefault();}catch(x){} persistFScale(); applyFScale(true); },{passive:false});
  } else {
    var pinching=false, startDist=0, startScale=1;
    function dist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
    V.addEventListener('touchstart',function(e){ if(e.touches.length===2){ pinching=true; startDist=dist(e.touches); startScale=rbFScale; } },{passive:true});
    V.addEventListener('touchmove',function(e){ if(pinching && e.touches.length===2){ e.preventDefault(); var d=dist(e.touches); if(startDist>0){ rbFScale=rbClampF(startScale*(d/startDist)); applyFScale(false); } } },{passive:false});
    V.addEventListener('touchend',function(e){ if(pinching && e.touches.length<2){ pinching=false; persistFScale(); applyFScale(true); } },{passive:false});
  }
})();
